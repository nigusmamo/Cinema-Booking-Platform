# Air configuration for Go hot reload inside Docker.
# https://github.com/air-verse/air
root = "."
tmp_dir = "tmp"

[build]
  # Rebuild the server binary into ./tmp on every change
  cmd = "go build -o ./tmp/server ."
  bin = "./tmp/server"
  # Debounce rapid file-save bursts (milliseconds)
  delay = 500
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  exclude_dir = ["tmp", "vendor", "uploads"]
  stop_on_error = true
  send_interrupt = true

[log]
  time = true

[misc]
  clean_on_exit = true

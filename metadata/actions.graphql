type Mutation {
  login(
    email: String!
    password: String!
  ): LoginOutput
}

type Mutation {
  pay(
    amount: String!
    email: String!
    first_name: String!
    last_name: String!
  ): PaymentOutput
}

type Mutation {
  signup(
    full_name: String!
    email: String!
    password: String!
  ): SignupOutput
}

type Mutation {
  get_upload_signature: UploadSignatureOutput
}

type LoginOutput {
  token: String!
  id: String!
  full_name: String!
}

type SignupOutput {
  id: String!
  full_name: String!
  email: String!
}

type PaymentOutput {
  checkout_url: String!
  tx_ref: String!
}

type UploadSignatureOutput {
  signature: String!
  timestamp: Int!
  api_key: String!
  cloud_name: String!
  folder: String!
}


actions:
  - name: login
    definition:
      kind: synchronous
      handler: http://host.docker.internal:8000/auth/login
    permissions:
      - role: anonymous
    comment: login
  - name: pay
    definition:
      kind: synchronous
      handler: http://host.docker.internal:8000/payment/initialize
    permissions:
      - role: user
    comment: pay
  - name: signup
    definition:
      kind: synchronous
      handler: http://host.docker.internal:8000/auth/signup
    permissions:
      - role: anonymous
    comment: signup
  - name: upload_file
    definition:
      kind: synchronous
      handler: http://host.docker.internal:8000/upload/file
    comment: upload_file
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: LoginOutput
    - name: SignupOutput
    - name: PaymentOutput
    - name: FileUploadOutput
  scalars: []

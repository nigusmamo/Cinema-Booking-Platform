actions:
  - name: login
    definition:
      kind: synchronous
      handler: http://host.docker.internal:8000/auth/login
      headers:
        - name: X-Hasura-Action-Secret
          value_from_env: ACTION_SECRET
    permissions:
      - role: anonymous
    comment: login
  - name: pay
    definition:
      kind: synchronous
      handler: http://host.docker.internal:8000/payment/initialize
      headers:
        - name: X-Hasura-Action-Secret
          value_from_env: ACTION_SECRET
    permissions:
      - role: user
    comment: pay
  - name: signup
    definition:
      kind: synchronous
      handler: http://host.docker.internal:8000/auth/signup
      headers:
        - name: X-Hasura-Action-Secret
          value_from_env: ACTION_SECRET
    permissions:
      - role: anonymous
    comment: signup
  - name: verify_payment
    definition:
      kind: synchronous
      handler: http://host.docker.internal:8000/payment/verify
      headers:
        - name: X-Hasura-Action-Secret
          value_from_env: ACTION_SECRET
    permissions:
      - role: user
    comment: verify_payment
  - name: get_upload_signature
    definition:
      kind: synchronous
      handler: http://host.docker.internal:8000/upload/signature
      headers:
        - name: X-Hasura-Action-Secret
          value_from_env: ACTION_SECRET
    permissions:
      - role: admin
      - role: user
    comment: get_upload_signature
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: LoginOutput
    - name: SignupOutput
    - name: PaymentOutput
    - name: UploadSignatureOutput
    - name: VerifyPaymentOutput
  scalars: []

table:
  name: booking_seats
  schema: public
object_relationships:
  - name: booking
    using:
      foreign_key_constraint_on: booking_id
select_permissions:
  - role: user
    permission:
      columns:
        - booking_id
        - id
        - seat_id
      filter:
        booking:
          user_id:
            _eq: X-Hasura-User-Id
    comment: ""

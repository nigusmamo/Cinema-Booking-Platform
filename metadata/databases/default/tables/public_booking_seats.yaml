table:
  name: booking_seats
  schema: public
object_relationships:
  - name: booking
    using:
      foreign_key_constraint_on: booking_id
  - name: seat
    using:
      foreign_key_constraint_on: seat_id
select_permissions:
  - role: anonymous
    permission:
      columns:
        - booking_id
        - id
        - seat_id
      filter: {}
      allow_aggregations: true
    comment: ""
  - role: user
    permission:
      columns:
        - booking_id
        - id
        - seat_id
      filter: {}
    comment: ""

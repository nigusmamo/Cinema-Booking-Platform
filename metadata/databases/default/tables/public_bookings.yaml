table:
  name: bookings
  schema: public
object_relationships:
  - name: schedule
    using:
      foreign_key_constraint_on: schedule_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: booking_seats
    using:
      foreign_key_constraint_on:
        column: booking_id
        table:
          name: booking_seats
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      set:
        user_id: x-hasura-User-Id
      columns:
        - total_price
        - booking_reference
        - payment_method
        - payment_status
        - created_at
        - id
        - schedule_id
        - user_id
    comment: ""
select_permissions:
  - role: anonymous
    permission:
      columns:
        - total_price
        - booking_reference
        - payment_method
        - payment_status
        - created_at
        - id
        - schedule_id
        - user_id
      filter: {}
    comment: ""
  - role: user
    permission:
      columns:
        - total_price
        - booking_reference
        - payment_method
        - payment_status
        - created_at
        - id
        - schedule_id
        - user_id
      filter: {}
    comment: ""

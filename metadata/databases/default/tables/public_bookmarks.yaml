table:
  name: bookmarks
  schema: public
object_relationships:
  - name: movie
    using:
      foreign_key_constraint_on: movie_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: user
    permission:
      check: {}
      set:
        user_id: x-hasura-User-Id
      columns:
        - id
        - movie_id
        - user_id
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - movie_id
        - user_id
      filter: {}
    comment: ""

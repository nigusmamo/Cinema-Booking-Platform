table:
  name: movie_directors
  schema: public
object_relationships:
  - name: director
    using:
      foreign_key_constraint_on: director_id
  - name: movie
    using:
      foreign_key_constraint_on: movie_id
select_permissions:
  - role: anonymous
    permission:
      columns:
        - director_id
        - id
        - movie_id
      filter: {}
    comment: ""
  - role: user
    permission:
      columns:
        - director_id
        - id
        - movie_id
      filter: {}
    comment: ""

table:
  name: movies
  schema: public
array_relationships:
  - name: bookmarks
    using:
      foreign_key_constraint_on:
        column: movie_id
        table:
          name: bookmarks
          schema: public
  - name: movie_directors
    using:
      foreign_key_constraint_on:
        column: movie_id
        table:
          name: movie_directors
          schema: public
  - name: movie_genres
    using:
      foreign_key_constraint_on:
        column: movie_id
        table:
          name: movie_genres
          schema: public
  - name: movie_images
    using:
      foreign_key_constraint_on:
        column: movie_id
        table:
          name: movie_images
          schema: public
  - name: movie_stars
    using:
      foreign_key_constraint_on:
        column: movie_id
        table:
          name: movie_stars
          schema: public
  - name: ratings
    using:
      foreign_key_constraint_on:
        column: movie_id
        table:
          name: ratings
          schema: public
  - name: schedules
    using:
      foreign_key_constraint_on:
        column: movie_id
        table:
          name: schedules
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - release_date
        - duration_minutes
        - rating_avg
        - description
        - main_image
        - status
        - title
        - trailer_url
        - created_at
        - updated_at
        - id
      filter: {}
    comment: ""
  - role: user
    permission:
      columns:
        - release_date
        - duration_minutes
        - rating_avg
        - description
        - main_image
        - status
        - title
        - trailer_url
        - created_at
        - updated_at
        - id
      filter: {}
    comment: ""

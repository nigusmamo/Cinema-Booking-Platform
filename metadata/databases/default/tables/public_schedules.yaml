table:
  name: schedules
  schema: public
object_relationships:
  - name: movie
    using:
      foreign_key_constraint_on: movie_id
array_relationships:
  - name: bookings
    using:
      foreign_key_constraint_on:
        column: schedule_id
        table:
          name: bookings
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - price
        - end_time
        - start_time
        - id
        - movie_id
      filter: {}
    comment: ""
  - role: user
    permission:
      columns:
        - price
        - end_time
        - start_time
        - id
        - movie_id
      filter: {}
    comment: ""

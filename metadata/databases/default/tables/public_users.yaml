table:
  name: users
  schema: public
array_relationships:
  - name: bookings
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: bookings
          schema: public
  - name: bookmarks
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: bookmarks
          schema: public
  - name: ratings
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: ratings
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - created_at
        - email
        - full_name
        - id
        - password
        - role
        - updated_at
      filter:
        id:
          _eq: X-Hasura-User-Id
    comment: ""
